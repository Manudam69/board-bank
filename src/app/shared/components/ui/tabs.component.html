<nav class="hide-mobile" aria-label="Pestañas">
  <div class="flex gap-1 rounded-full border border-border bg-surface p-1">
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        class="group relative inline-flex items-center gap-2 whitespace-nowrap rounded-full px-3 py-1.5 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-focus focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        [class.text-text]="activeTab() === tab.id"
        [class.text-text-secondary]="activeTab() !== tab.id"
        [class.hover:text-text]="activeTab() !== tab.id"
        [class.bg-surface-elevated]="activeTab() === tab.id"
        [class.shadow-sm]="activeTab() === tab.id"
        (click)="activeTab.set(tab.id)"
        [attr.aria-current]="activeTab() === tab.id ? 'page' : null"
      >
        @if (tab.icon) {
          <svg
            class="h-4 w-4"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path [attr.d]="tab.icon" />
          </svg>
        }
        {{ tab.label }}
        @if (tab.badge) {
          <span class="sr-only">({{ tab.badge }} pendiente{{ tab.badge > 1 ? 's' : '' }})</span>
        }

        @if (tab.badge) {
          <span
            class="absolute -right-1 -top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-negative px-1 text-[10px] font-bold leading-none text-bg"
            aria-hidden="true"
          >
            {{ tab.badge > 9 ? '9+' : tab.badge }}
          </span>
        }
      </button>
    }
  </div>
</nav>
