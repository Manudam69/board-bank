<button
  type="button"
  class="w-full rounded-2xl border p-4 text-left shadow-sm transition hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
  [class.border-blue-500]="selected()"
  [class.ring-2]="selected()"
  [class.ring-blue-500]="selected()"
  [class.border-slate-200]="!selected()"
  [class.opacity-60]="player().bankrupt"
  (click)="onClick()"
>
  <div class="flex items-center gap-3">
    <span class="h-10 w-10 shrink-0 rounded-full {{ player().avatarColor }}"></span>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <h3 class="truncate text-lg font-semibold text-slate-900">{{ player().name }}</h3>
        @if (player().host) {
          <span class="rounded bg-slate-200 px-1.5 py-0.5 text-xs font-medium text-slate-700">Host</span>
        }
        @if (player().bankrupt) {
          <span class="rounded bg-rose-100 px-1.5 py-0.5 text-xs font-medium text-rose-700">Quiebra</span>
        }
      </div>
      <div class="mt-1 flex items-baseline justify-between">
        <app-money-display [amount]="player().cash" [currency]="currency()" size="lg" />
        <span class="text-xs text-slate-500">
          {{ propertyCount() }} propiedad(es)
        </span>
      </div>
      @if (isHostView()) {
        <p class="mt-1 text-xs text-slate-500">Valor neto: {{ formattedNetWorth() }}</p>
      }
    </div>
  </div>
</button>
