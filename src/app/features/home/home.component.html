<app-home-background />

<header class="absolute left-0 right-0 top-0 z-50 bg-bg/95">
  <nav
    class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4"
    aria-label="Navegación principal"
  >
    <div class="flex items-center gap-2 text-text">
      <app-logo size="md" class="text-accent" />
      <span class="font-bold tracking-tight">BOARD BANK</span>
    </div>

    <div class="flex items-center gap-2">
      <a
        href="#como-funciona"
        class="hidden text-sm font-medium text-text-secondary transition hover:text-text sm:inline-block"
      >
        ¿Cómo funciona?
      </a>

      <button
        type="button"
        class="focus-ring-inset rounded-full p-2 text-text-secondary transition hover:bg-surface-elevated hover:text-text"
        [attr.aria-label]="soundEnabled() ? 'Desactivar sonidos' : 'Activar sonidos'"
        [attr.aria-pressed]="soundEnabled()"
        (click)="toggleSound()"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="volumeIcon()" />
        </svg>
      </button>
    </div>
  </nav>
</header>

<main class="relative">
  @if (authError()) {
    <div class="mx-auto max-w-4xl px-4 pt-20">
      <div
        class="rounded-lg border border-warning/30 bg-warning-muted p-4 text-sm text-warning"
        role="alert"
      >
        <p class="font-medium">{{ authError() }}</p>
        <p class="mt-1 text-text-secondary">
          Ve a Firebase Console → Authentication → Sign-in method → habilita Anonymous.
        </p>
      </div>
    </div>
  }

  @if (!authReady()) {
    <div class="flex min-h-svh items-center justify-center px-4">
      <app-spinner label="Conectando con Firebase..." />
    </div>
  } @else {
    @if (activeRoomData(); as room) {
      <div class="mx-auto max-w-4xl px-4 pt-20">
        <app-rejoin-banner [room]="room" (dismissAction)="dismissRejoin()" />
      </div>
    }

    <app-hero (createAction)="openCreate()" (joinAction)="openJoin()" />
    <app-how-it-works />
    <app-product-preview />
    <app-social-section />
    <app-site-footer />
  }
</main>

<app-modal
  [open]="showCreateModal()"
  title="Crear partida"
  (closeAction)="showCreateModal.set(false)"
>
  @if (showCreateModal()) {
    <app-create-flow />
  }
</app-modal>

<app-modal [open]="showJoinModal()" title="Unirse a partida" (closeAction)="closeJoin()">
  @if (showJoinModal()) {
    <app-join-flow />
  }
</app-modal>
