<div class="border-b border-slate-200">
  <nav class="-mb-px flex gap-6" aria-label="Pestañas">
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        class="inline-flex items-center gap-2 border-b-2 px-1 py-3 text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-blue-500]="activeTab() === tab.id"
        [class.text-blue-600]="activeTab() === tab.id"
        [class.border-transparent]="activeTab() !== tab.id"
        [class.text-slate-500]="activeTab() !== tab.id"
        [class.hover:border-slate-300]="activeTab() !== tab.id"
        [class.hover:text-slate-700]="activeTab() !== tab.id"
        (click)="activeTab.set(tab.id)"
        [attr.aria-current]="activeTab() === tab.id ? 'page' : null"
      >
        @if (tab.icon) {
          <span aria-hidden="true">{{ tab.icon }}</span>
        }
        {{ tab.label }}
      </button>
    }
  </nav>
</div>
