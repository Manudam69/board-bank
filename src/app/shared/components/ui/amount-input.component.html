<div class="space-y-1">
  <label class="block text-sm font-medium text-text-secondary">{{ label() }}</label>
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="rounded-lg border border-border bg-surface-elevated px-3 py-2 text-text-secondary hover:bg-surface-hover disabled:opacity-50"
      [disabled]="disabled()"
      (click)="adjust(-step())"
      aria-label="Disminuir"
    >-</button>
    <input
      type="number"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="amount()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      class="w-full rounded-lg border border-border bg-surface-elevated px-3 py-2 text-center text-text focus:border-accent focus:outline-none"
      (input)="onInput($any($event).target.value)"
    />
    <button
      type="button"
      class="rounded-lg border border-border bg-surface-elevated px-3 py-2 text-text-secondary hover:bg-surface-hover disabled:opacity-50"
      [disabled]="disabled()"
      (click)="adjust(step())"
      aria-label="Aumentar"
    >+</button>
  </div>
  <p class="text-xs text-text-muted">Vista previa: <span class="font-medium text-text">{{ preview() }}</span></p>
</div>
