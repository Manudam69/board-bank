<div class="space-y-5">
  <div class="rounded-2xl border border-border bg-surface p-5">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
      <div class="flex items-center gap-3">
        <span class="h-12 w-12 shrink-0 rounded-full {{ me().avatarColor }} ring-2 ring-bg"></span>
        <div>
          <h2 class="text-xl font-bold text-text">{{ me().name }}</h2>
          @if (me().host) {
            <span class="inline-block rounded bg-surface-elevated px-2 py-0.5 text-xs font-medium text-text-secondary">Host</span>
          }
        </div>
      </div>
      <div class="text-left sm:text-right">
        <p class="text-xs uppercase tracking-wide text-text-muted">Efectivo</p>
        <app-money-display [amount]="me().cash" [currency]="currency()" size="xl" />
      </div>
    </div>
    <div class="mt-5 flex flex-wrap gap-4 border-t border-border pt-4 text-sm">
      <div>
        <span class="text-text-muted">Valor neto:</span>
        <app-money-display [amount]="netWorth()" [currency]="currency()" size="sm" />
      </div>
      <div class="text-text-secondary">Propiedades: <span class="font-medium text-text">{{ myProperties().length }}</span></div>
    </div>
  </div>

  <div class="rounded-2xl border border-border bg-surface p-5">
    <h3 class="mb-4 text-sm font-semibold uppercase tracking-wide text-text-muted">Acciones del banco</h3>
    <div class="flex flex-wrap gap-2">
      <app-button (clickAction)="salaryAction.emit()">
        <span class="inline-flex items-center gap-1.5">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Cobrar sueldo
        </span>
      </app-button>
      <app-button variant="secondary" (clickAction)="taxAction.emit('income')">Pagar renta</app-button>
      <app-button variant="secondary" (clickAction)="taxAction.emit('luxury')">Pagar lujo</app-button>
      <app-button variant="danger" (clickAction)="bankruptcyAction.emit()">Declarar quiebra</app-button>
    </div>
  </div>

  <div>
    <h3 class="mb-3 text-sm font-semibold uppercase tracking-wide text-text-muted">Mis propiedades</h3>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      @for (item of myProperties(); track item.meta.id) {
        <app-property-card
          [property]="item.meta"
          [edition]="edition()"
          [owned]="item.owned"
          [ownerName]="''"
        />
      } @empty {
        <div class="col-span-full">
          <app-empty-state
            message="Aún no tienes propiedades."
            description="Usa Comprar en la barra de acciones para adquirir una."
          />
        </div>
      }
    </div>
  </div>
</div>
