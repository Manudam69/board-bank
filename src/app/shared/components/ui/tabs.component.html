<div class="rounded-lg bg-surface-elevated/50 p-1">
  <nav class="flex gap-1" aria-label="Pestañas">
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        class="inline-flex flex-1 items-center justify-center gap-2 rounded-md px-3 py-2 text-sm font-medium transition-colors focus:outline-none"
        [class.bg-surface]="activeTab() === tab.id"
        [class.text-text]="activeTab() === tab.id"
        [class.shadow-sm]="activeTab() === tab.id"
        [class.text-text-secondary]="activeTab() !== tab.id"
        [class.hover:text-text]="activeTab() !== tab.id"
        (click)="activeTab.set(tab.id)"
        [attr.aria-current]="activeTab() === tab.id ? 'page' : null"
      >
        @if (tab.icon) {
          <svg class="h-4 w-4" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path [attr.d]="tab.icon" />
          </svg>
        }
        {{ tab.label }}
      </button>
    }
  </nav>
</div>
