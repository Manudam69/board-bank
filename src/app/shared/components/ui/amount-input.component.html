<div class="space-y-1">
  <label class="block text-sm font-medium text-slate-700">{{ label() }}</label>
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="rounded-lg bg-slate-100 px-3 py-2 text-slate-700 hover:bg-slate-200 disabled:opacity-50"
      [disabled]="disabled()"
      (click)="adjust(-step())"
      aria-label="Disminuir"
    >-</button>
    <input
      type="number"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="amount()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      class="w-full rounded-lg border border-slate-300 px-3 py-2 text-center text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      (input)="onInput($any($event).target.value)"
    />
    <button
      type="button"
      class="rounded-lg bg-slate-100 px-3 py-2 text-slate-700 hover:bg-slate-200 disabled:opacity-50"
      [disabled]="disabled()"
      (click)="adjust(step())"
      aria-label="Aumentar"
    >+</button>
  </div>
  <p class="text-sm text-slate-500">Vista previa: {{ preview() }}</p>
</div>
