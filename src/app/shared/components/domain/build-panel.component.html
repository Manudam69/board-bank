<div class="space-y-4">
  <p class="text-sm text-slate-600">Jugador: <strong>{{ me().name }}</strong> ({{ me().cash | money: currency() }})</p>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
    @for (item of candidateProperties(); track item.meta.id) {
      <app-property-card
        [property]="item.meta"
        [edition]="edition()"
        [owned]="item.owned"
        [ownerName]="''"
        [selectable]="true"
        [selected]="selected()?.id === item.meta.id"
        (propertyClick)="onSelect(item.meta)"
      />
    } @empty {
      <p class="col-span-full text-center text-sm text-slate-500">No tienes propiedades disponibles para construir.</p>
    }
  </div>

  @if (selected() && selectedOwned()) {
    <div class="flex flex-wrap gap-2">
      <app-button
        [disabled]="!canBuildHouse()"
        (clickAction)="submit('house')"
      >
        + Casa
      </app-button>
      <app-button
        variant="secondary"
        [disabled]="!canBuildHotel()"
        (clickAction)="submit('hotel')"
      >
        + Hotel
      </app-button>
      <app-button
        variant="ghost"
        [disabled]="!canSellHouse()"
        (clickAction)="submit('sell-house')"
      >
        - Casa
      </app-button>
      <app-button
        variant="ghost"
        [disabled]="!canSellHotel()"
        (clickAction)="submit('sell-hotel')"
      >
        - Hotel
      </app-button>
    </div>
  }
</div>
