<div class="space-y-4">
  <div class="rounded-lg border border-border bg-surface-elevated/50 p-3 text-sm">
    Origen: <span class="font-semibold text-text">{{ me().name }}</span>
    <span class="ml-2 text-text-secondary">{{ me().cash | money: currency() }}</span>
  </div>

  <div class="space-y-1">
    <label class="block text-sm font-medium text-text-secondary" for="to">Destino</label>
    <div class="relative">
      <select
        id="to"
        class="w-full appearance-none rounded-lg border border-border bg-surface-elevated px-3 py-2.5 pr-10 text-text focus:border-accent focus:outline-none"
        [(ngModel)]="toId"
      >
        <option [ngValue]="undefined" disabled selected>Selecciona destino</option>
        @for (p of eligibleTo(); track p.id) {
          <option [ngValue]="p.id">{{ p.name }}</option>
        }
      </select>
      <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>

  <app-amount-input [(amount)]="amount" [currency]="currency()" label="Cantidad" [max]="me().cash" />

  <div class="space-y-1">
    <label class="block text-sm font-medium text-text-secondary" for="reason">Motivo (opcional)</label>
    <input
      id="reason"
      type="text"
      class="w-full rounded-lg border border-border bg-surface-elevated px-3 py-2.5 text-text placeholder:text-text-muted focus:border-accent focus:outline-none"
      placeholder="Ej. alquiler, deuda, regalo..."
      [(ngModel)]="reason"
    />
  </div>

  <app-button [fullWidth]="true" [disabled]="!canSubmit()" (clickAction)="submit()">
    Confirmar transferencia
  </app-button>
</div>
