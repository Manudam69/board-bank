@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-end justify-center bg-black/80 p-4 sm:items-center"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <div
      class="relative w-full max-w-sm rounded-modal border border-border bg-surface p-6 shadow-2xl shadow-black/40"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-3 flex items-start gap-3">
        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-danger-muted"
        >
          <svg
            class="h-5 w-5 text-negative"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-semibold text-text">{{ title() }}</h2>
          <p class="mt-1 text-sm text-text-secondary">{{ message() }}</p>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <app-button variant="ghost" (clickAction)="cancel()">{{ cancelLabel() }}</app-button>
        <app-button [variant]="confirmVariant()" (clickAction)="confirm()">{{
          confirmLabel()
        }}</app-button>
      </div>
    </div>
  </div>
}
