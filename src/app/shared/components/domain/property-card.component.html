<button
  type="button"
  class="group relative flex w-full flex-col overflow-hidden rounded-xl border text-left transition hover:shadow-md focus:outline-none"
  [class.border-accent]="selected()"
  [class.ring-1]="selected()"
  [class.ring-accent]="selected()"
  [class.bg-surface]="selected()"
  [class.border-border]="!selected()"
  [class.bg-surface-elevated]="!selected()"
  [class.opacity-60]="disabled()"
  [class.cursor-not-allowed]="disabled()"
  [disabled]="disabled()"
  (click)="onClick()"
  [attr.aria-label]="property().name"
>
  <div
    class="h-2 w-full"
    [style.background-color]="property().groupColor"
    [class.ring-1]="needsBorder()"
    [class.ring-border]="needsBorder()"
  ></div>

  <div class="flex flex-1 flex-col p-3">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <p class="truncate text-xs font-medium text-text-muted">{{ property().group }}</p>
        <h4 class="truncate text-base font-semibold text-text">{{ property().name }}</h4>
      </div>
      @if (isOwned()) {
        <span class="shrink-0 rounded-full bg-surface-hover px-2 py-0.5 text-xs font-medium text-text-secondary">
          {{ ownerName() || 'Tuyo' }}
        </span>
      }
    </div>

    <div class="mt-2 flex items-center justify-between">
      <app-money-display [amount]="property().price" [currency]="currency()" size="sm" />
      <span class="text-xs text-text-muted">Hip: {{ property().mortgageValue | money: currency() }}</span>
    </div>

    @if (isOwned()) {
      <div class="mt-3 flex flex-wrap items-center gap-2">
        @if (isMortgaged()) {
          <span class="inline-flex items-center gap-1 rounded-full bg-warning-muted px-2 py-0.5 text-xs font-medium text-warning">
            <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            Hipotecada
          </span>
        }
        @if (buildingSummary(); as building) {
          <span class="inline-flex items-center gap-1 rounded-full bg-accent-muted px-2 py-0.5 text-xs font-medium text-text">
            @if (building.type === 'hotel') {
              <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5" />
              </svg>
            } @else {
              <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
            }
            {{ building.label }}
          </span>
        }
      </div>
      <div class="mt-1 text-xs text-text-secondary">
        Alquiler actual: <span class="font-medium text-text">{{ rentPreview() | money: currency() }}</span>
      </div>
    }

    @if (showActions() && actionLabel()) {
      <button
        type="button"
        class="mt-3 w-full rounded-lg bg-accent px-3 py-1.5 text-sm font-medium text-white hover:bg-accent-hover focus:outline-none"
        (click)="onAction($event)"
      >
        {{ actionLabel() }}
      </button>
    }
  </div>
</button>
