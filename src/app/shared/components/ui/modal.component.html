@if (rendered()) {
  <div
    [class]="backdropClasses()"
    [style.background-color]="backdropColor()"
    [style.transition]="backdropTransition()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    [attr.data-closing]="closing() ? '' : null"
    (click)="close()"
    (keydown.escape)="onKeydown($event)"
    tabindex="-1"
  >
    <div
      #panel
      [class]="dialogClasses()"
      [style.translate]="panelTranslate()"
      [style.transition]="panelTransition()"
      [style.height.px]="frozenHeight()"
      (click)="$event.stopPropagation()"
    >
      <div
        class="shrink-0 touch-none px-4 pt-3 pb-2 sm:touch-auto sm:px-6 sm:pt-6 sm:pb-4"
        (pointerdown)="onDragStart($event)"
        (pointermove)="onDragMove($event)"
        (pointerup)="onDragEnd($event)"
        (pointercancel)="onDragEnd($event, true)"
      >
        <div class="mx-auto mb-2 h-1 w-12 rounded-full bg-border sm:mb-4 sm:hidden" aria-hidden="true"></div>
        <div class="flex items-center justify-between gap-4">
          @if (title()) {
            <h2 class="text-lg font-semibold text-text">{{ title() }}</h2>
          } @else {
            <span></span>
          }
          @if (closeable()) {
            <button
              type="button"
              class="focus-ring-inset -mr-2 flex h-11 w-11 items-center justify-center rounded-full text-text-muted transition hover:bg-surface-elevated hover:text-text focus:outline-none"
              aria-label="Cerrar"
              (click)="close()"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          }
        </div>
      </div>
      <div
        class="flex-1 min-h-0 overflow-y-auto overscroll-contain px-4 text-text-secondary sm:px-6"
        [style.padding-bottom]="flushBottom() ? null : 'calc(1.5rem + var(--safe-bottom))'"
      >
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
