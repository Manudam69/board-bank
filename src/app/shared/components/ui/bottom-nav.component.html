<nav
  class="fixed bottom-0 left-0 right-0 z-40 border-t border-border bg-bg/95 backdrop-blur-sm pb-[env(safe-area-inset-bottom)] hide-desktop"
  aria-label="Navegación principal"
>
  <div class="grid h-16 auto-cols-fr grid-flow-col items-center">
    @for (item of items(); track item.id) {
      <button
        type="button"
        class="group relative flex min-h-[48px] flex-col items-center justify-center gap-1 px-1 text-xs transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-focus focus-visible:ring-offset-2 focus-visible:ring-offset-bg"
        [class.text-text]="activeItem() === item.id"
        [class.text-text-muted]="activeItem() !== item.id"
        [class.hover:text-text]="activeItem() !== item.id"
        [attr.aria-current]="activeItem() === item.id ? 'page' : null"
        [attr.aria-label]="
          item.badge
            ? item.label + ', ' + item.badge + ' pendiente' + (item.badge > 1 ? 's' : '')
            : item.label
        "
        (click)="activeItem.set(item.id)"
      >
        <svg
          class="h-6 w-6 transition-transform group-active:scale-90"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <span class="whitespace-nowrap">{{ item.label }}</span>

        @if (item.badge) {
          <span
            class="absolute right-1 top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-negative px-1 text-[10px] font-bold leading-none text-bg"
            aria-hidden="true"
          >
            {{ item.badge > 9 ? '9+' : item.badge }}
          </span>
        }
      </button>
    }
  </div>
</nav>
