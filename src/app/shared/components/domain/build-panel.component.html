<div class="space-y-4">
  <div class="rounded-lg border border-border bg-surface-elevated/50 p-3 text-sm">
    Jugador: <span class="font-semibold text-text">{{ me().name }}</span>
    <span class="ml-2 text-text-secondary">{{ me().cash | money: currency() }}</span>
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
    @for (item of candidateProperties(); track item.meta.id) {
      <app-property-card
        [property]="item.meta"
        [edition]="edition()"
        [owned]="item.owned"
        [ownerName]="''"
        [selectable]="true"
        [selected]="selected()?.id === item.meta.id"
        (propertyClick)="onSelect(item.meta)"
      />
    } @empty {
      <p class="col-span-full text-center text-sm text-text-secondary">No tienes propiedades disponibles para construir.</p>
    }
  </div>

  @if (selected() && selectedOwned()) {
    <div class="rounded-lg border border-border bg-surface-elevated/50 p-3">
      <p class="mb-3 text-sm text-text-secondary">Construcciones en <span class="font-semibold text-text">{{ selected()!.name }}</span>:</p>
      <div class="flex flex-wrap gap-2">
        <app-button [disabled]="!canBuildHouse()" (clickAction)="submit('house')">
          <span class="inline-flex items-center gap-1">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Casa
          </span>
        </app-button>
        <app-button variant="secondary" [disabled]="!canBuildHotel()" (clickAction)="submit('hotel')">
          <span class="inline-flex items-center gap-1">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Hotel
          </span>
        </app-button>
        <app-button variant="ghost" [disabled]="!canSellHouse()" (clickAction)="submit('sell-house')">
          <span class="inline-flex items-center gap-1">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
            </svg>
            Casa
          </span>
        </app-button>
        <app-button variant="ghost" [disabled]="!canSellHotel()" (clickAction)="submit('sell-hotel')">
          <span class="inline-flex items-center gap-1">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
            </svg>
            Hotel
          </span>
        </app-button>
      </div>
    </div>
  }
</div>
